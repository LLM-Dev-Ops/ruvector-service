name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node 20 quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.5
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests and coverage
        run: npm test -- --runInBand --coverage

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_DB: ruvector-postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: adr1test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ruvector-postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUVVECTOR_DB_HOST: localhost
      RUVVECTOR_DB_PORT: 5432
      RUVVECTOR_DB_NAME: ruvector-postgres
      RUVVECTOR_DB_USER: postgres
      RUVVECTOR_DB_PASSWORD: adr1test
      RUVVECTOR_EMBEDDING_DIM: 4
      EXECUTION_HMAC_SECRET: test-hmac-secret-minimum-32-chars-long
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.5
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run real PostgreSQL integration tests
        run: npm run test:integration -- --runInBand
